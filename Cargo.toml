[package]
name = "peisar_fs"
version = "0.1.0"
edition = "2024"
# Exclude the internal test binary and its generated JSON output from the
# published crate. `src/main.rs` is a local test harness, not a shipped binary.
exclude = ["src/main.rs"]


[dependencies]
napi = "3"
napi-derive = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
blake3 = "1.4"
notify = "6"


[build-dependencies]
napi-build = "2"


[lib]
name = "peisar_fs"
path = "src/lib.rs"
# `rlib` for the CLI binary + integration tests; `cdylib` for the Node
# native addon (only built when the `napi` feature is on).
crate-type = ["rlib", "cdylib"]
