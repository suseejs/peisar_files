[package]
name = "peisar_fs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/phothinmg/peisar"
readme = "README.md"
# Exclude the internal test binary and its generated JSON output from the
# published crate. `src/main.rs` is a local test harness, not a shipped binary.
exclude = ["src/main.rs"]


[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
blake3 = "1.4"
notify = "6"
bincode = "1.3"


[lib]
name = "peisar_fs"
path = "src/lib.rs"
